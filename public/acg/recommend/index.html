<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACG · Recommend</title>
    <meta name="description" content="ACG recommend list (archived static snapshot)" />
    <link rel="icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="cyberpunk.css" />
    <link rel="stylesheet" href="page.css" />
    <style>
      @font-face {
        font-family: "Cyberpunk";
        src: url(Cyberpunk.ttf) format("truetype");
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .header__inner {
        width: min(100%, 1480px);
        margin: 0 auto;
        padding: 0 32px;
      }
      .header h1 {
        margin: 0;
        font-family: "Cyberpunk", sans-serif;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        padding: 14px 0 10px;
        color: var(--black);
        text-shadow: var(--cyan-cyberpunk-font1) 1px 1px, var(--cyan-cyberpunk-font2) 2px 2px;
        text-transform: uppercase;
      }
      .content { padding: 28px 0 72px; min-height: calc(100vh - 100px); }
      .wrap { width: min(100%, 1480px); margin: 0 auto; padding: 0 32px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px 18px;
        align-items: start;
      }
      .item {
        content-visibility: auto;
        contain-intrinsic-size: 200px 310px;
        transition: transform 180ms ease, filter 180ms ease;
      }
      .item img {
        aspect-ratio: 1 / 1.414;
        object-fit: cover;
        width: 100%;
        display: block;
        background: #171717;
        transition: filter 180ms ease;
      }
      .itemLabel.itemLabel.itemLabel {
        min-width: 0;
        padding: 7px 8px 4px;
        font-size: 13px;
        line-height: 1.3;
      }
      .itemLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 3px 8px 5px;
      }
      .sourceLink {
        flex: 1 1 64px;
        min-width: 0;
        padding: 5px 6px;
        color: var(--black);
        border: 1px solid var(--black);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font: 700 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
        clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
        transition: filter 150ms ease, transform 150ms ease;
      }
      .sourceIcon { width: 13px; height: 13px; flex: none; }
      .sourceLink--bangumi { background: #a8d8e8; }
      .sourceLink--mikan { background: #ffbd59; }
      .tbc { width: min(100%, 1480px); margin: 44px auto 12px; padding: 0 32px; }
      .tbc img { height: 36px; width: auto; max-width: 100%; object-fit: contain; }
      @media (hover: hover) {
        .item:hover { transform: translateY(-4px); filter: drop-shadow(0 8px 0 rgba(0, 255, 210, 0.45)); }
        .item:hover img { filter: saturate(1.08) contrast(1.03); }
        .sourceLink:hover { filter: brightness(1.14); transform: translateY(-1px); }
      }
      @media (max-width: 639px) {
        .header__inner { padding: 0 14px; }
        .header h1 { padding-bottom: 9px; }
        .content { padding: 18px 0 60px; }
        .wrap { padding: 0 12px; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
        .item.item.item { --tile-edges: 10px; }
        .itemLabel.itemLabel.itemLabel { padding: 6px 6px 3px; font-size: 12px; }
        .itemLinks { gap: 4px; padding: 3px 6px 4px; }
        .sourceLink { flex-basis: 58px; gap: 3px; padding: 5px 4px; font-size: 9px; }
        .sourceIcon { width: 11px; height: 11px; }
        .tbc { margin-top: 28px; padding: 0 12px; }
        .tbc img { height: 30px; }
      }
    </style>
  </head>
  <body class="cyberpunk-recommend">
    <div class="container">
      <div class="header">
        <div class="cyber-razor-bottom">
          <div class="header__inner">
            <h1>recommend</h1>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="wrap"><div class="grid" id="grid"></div></div>
        <div class="tbc"><img src="to-be-continued.jpg" alt="to be continued" /></div>
      </div>
      <div class="footer"></div>
    </div>
    <script>
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      const services = {
        bangumi: { label: "Bangumi" },
        mikan: { label: "Mikan" },
      };

      const sourceIcons = {
        bangumi: `<svg class="sourceIcon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 2.5h12v8.25H8l-3.5 2.75v-2.75H2z" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M6 4.5h2.2a1.5 1.5 0 0 1 0 3H6zm0 3h2.6a1.5 1.5 0 0 1 0 3H6z" fill="none" stroke="currentColor" stroke-width="1.2" />
        </svg>`,
        mikan: `<svg class="sourceIcon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path d="M8 3v11M3 8.5h10M4.1 4.6l7.8 7.8m0-7.8-7.8 7.8M8 3c.2-1.2 1-1.8 2.2-2" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>`,
      };

      const getSourceLinks = (item, serviceKey) => {
        const service = services[serviceKey];
        const configured = item.links?.[serviceKey];
        const entries = configured === undefined
          ? []
          : Array.isArray(configured) ? configured : [configured];

        return entries.filter(Boolean).map((entry, index) => {
          const isObject = typeof entry === "object";
          const url = isObject ? entry.url : String(entry);
          const label = isObject && entry.label
            ? entry.label
            : `${service.label}${entries.length > 1 ? ` ${index + 1}` : ""}`;
          if (!url) return "";
          return `<a class="sourceLink sourceLink--${serviceKey}" href="${esc(url)}" target="_blank" rel="noreferrer">${sourceIcons[serviceKey]}<span>${esc(label)}</span></a>`;
        });
      };

      fetch("items.json")
        .then((r) => r.json())
        .then((items) => {
          document.getElementById("grid").innerHTML = items
            .map(
              (i) => {
                const links = [
                  ...getSourceLinks(i, "bangumi"),
                  ...getSourceLinks(i, "mikan"),
                ].join("");
                return `<div class="item cyber-tile-small fg-dark">
                  <img src="${esc(i.image)}" width="90" height="127" loading="lazy" alt="${esc(i.name)}" />
                  <label class="itemLabel">${esc(i.name)}</label>
                  ${links ? `<div class="itemLinks">${links}</div>` : ""}
                </div>`;
              },
            )
            .join("");
        });
    </script>
  </body>
</html>
