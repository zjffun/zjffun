<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACG · Recommend</title>
    <meta name="description" content="ACG recommend list (archived static snapshot)" />
    <link rel="icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="cyberpunk.css" />
    <link rel="stylesheet" href="page.css" />
    <style>
      @font-face {
        font-family: "Cyberpunk";
        src: url(Cyberpunk.ttf) format("truetype");
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .header__inner {
        width: min(100%, 1480px);
        margin: 0 auto;
        padding: 0 32px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }
      .header h1 {
        margin: 0;
        font-family: "Cyberpunk", sans-serif;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        padding: 14px 0 10px;
        color: var(--black);
        text-shadow: var(--cyan-cyberpunk-font1) 1px 1px, var(--cyan-cyberpunk-font2) 2px 2px;
        text-transform: uppercase;
      }
      .header__meta {
        margin: 0;
        padding-bottom: 13px;
        color: var(--black);
        font: 700 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.12em;
        white-space: nowrap;
      }
      .content { padding: 28px 0 72px; min-height: calc(100vh - 100px); }
      .wrap { width: min(100%, 1480px); margin: 0 auto; padding: 0 32px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px 18px;
        align-items: start;
      }
      .item {
        content-visibility: auto;
        contain-intrinsic-size: 200px 310px;
        transition: transform 180ms ease, filter 180ms ease;
      }
      .item img {
        aspect-ratio: 1 / 1.414;
        object-fit: cover;
        width: 100%;
        display: block;
        background: #171717;
        transition: filter 180ms ease;
      }
      .itemLabel.itemLabel.itemLabel {
        min-width: 0;
        padding: 7px 8px 4px;
        font-size: 13px;
        line-height: 1.3;
      }
      .tbc { width: min(100%, 1480px); margin: 44px auto 12px; padding: 0 32px; }
      .tbc img { height: 36px; width: auto; max-width: 100%; object-fit: contain; }
      .back { position: fixed; right: 16px; bottom: 38px; font-size: 12px; z-index: 5; }
      .back a {
        display: block;
        padding: 7px 10px;
        border: 1px solid var(--yellow);
        color: var(--yellow);
        background: rgba(0, 0, 0, 0.82);
        text-decoration: none;
        backdrop-filter: blur(6px);
      }
      @media (hover: hover) {
        .item:hover { transform: translateY(-4px); filter: drop-shadow(0 8px 0 rgba(0, 255, 210, 0.45)); }
        .item:hover img { filter: saturate(1.08) contrast(1.03); }
        .back a:hover { color: var(--black); background: var(--yellow); }
      }
      @media (max-width: 639px) {
        .header__inner { padding: 0 14px; }
        .header h1 { padding-bottom: 9px; }
        .header__meta { display: none; }
        .content { padding: 18px 0 60px; }
        .wrap { padding: 0 12px; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
        .item.item.item { --tile-edges: 10px; }
        .itemLabel.itemLabel.itemLabel { padding: 6px 6px 3px; font-size: 12px; }
        .tbc { margin-top: 28px; padding: 0 12px; }
        .tbc img { height: 30px; }
        .back { right: 10px; bottom: 34px; }
      }
    </style>
  </head>
  <body class="cyberpunk-recommend">
    <div class="container">
      <div class="header">
        <div class="cyber-razor-bottom">
          <div class="header__inner">
            <h1>recommend</h1>
            <p class="header__meta"><span id="entry-count">--</span> ENTRIES // ARCHIVE</p>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="wrap"><div class="grid" id="grid"></div></div>
        <div class="tbc"><img src="to-be-continued.jpg" alt="to be continued" /></div>
      </div>
      <div class="footer"></div>
    </div>
    <div class="back"><a href="../">← ACG</a></div>
    <script>
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      fetch("items.json")
        .then((r) => r.json())
        .then((items) => {
          document.getElementById("entry-count").textContent = String(items.length).padStart(2, "0");
          document.getElementById("grid").innerHTML = items
            .map(
              (i) => `<div class="item cyber-tile-small fg-dark">
                <img src="${esc(i.image)}" width="90" height="127" loading="lazy" alt="${esc(i.name)}" />
                <label class="itemLabel">${esc(i.name)}</label>
              </div>`,
            )
            .join("");
        });
    </script>
  </body>
</html>
